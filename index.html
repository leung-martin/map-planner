<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#10151c" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <script>
      // Set before first paint so the page never flashes the wrong theme.
      (function () {
        var saved = null;
        try { saved = localStorage.getItem('mapplanner.theme'); } catch (e) {}
        var system = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = saved === 'light' || saved === 'dark' ? saved : system;
      })();
    </script>
    <title>Map Planner</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
